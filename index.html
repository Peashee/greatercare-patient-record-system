<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17695d" />
    <meta name="description" content="GreaterCare brings appointments, clinical assessments and patient records together in one secure, role-based care portal." />
    <title>GreaterCare · Secure patient record system</title>
    <script>
      // Apply the saved colour theme before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem("greatercare-theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
